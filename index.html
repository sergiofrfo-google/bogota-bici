<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <title>Bogotá Bici</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="map"></div>

  <!-- Origin / destination -->
  <form id="search" class="card search" autocomplete="off">
    <div class="field">
      <span class="dot dot-a" aria-hidden="true"></span>
      <label class="sr" for="from">Origen</label>
      <input id="from" placeholder="Origen (o toca el mapa)" enterkeyhint="search" />
      <button type="button" id="gps" class="mini" aria-label="Usar mi ubicación como origen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div class="field">
      <span class="dot dot-b" aria-hidden="true"></span>
      <label class="sr" for="to">Destino</label>
      <input id="to" placeholder="Destino (o toca el mapa)" enterkeyhint="search" />
    </div>
    <button type="button" id="swap" class="square" aria-label="Intercambiar origen y destino">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>
    </button>
    <ul id="suggest" class="suggest" hidden></ul>
  </form>

  <!-- Floating buttons -->
  <div class="fabs">
    <button id="layersBtn" class="square float" aria-label="Capas del mapa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button id="reportFab" class="square float" aria-label="Reportar un problema">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="color:#B45309"><path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
    </button>
  </div>
  <button id="reportBtn" class="pill-btn float">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Reportar
  </button>

  <!-- Report placement pin -->
  <div id="placePin" hidden aria-hidden="true">
    <svg viewBox="0 0 40 52"><path d="M20 50C20 50 36 32 36 19A16 16 0 1 0 4 19C4 32 20 50 20 50Z" fill="#B45309" stroke="#fff" stroke-width="3"/><circle cx="20" cy="19" r="6" fill="#fff"/></svg>
  </div>

  <!-- Bottom sheet: content swapped by app.js -->
  <section id="sheet" class="sheet" hidden aria-live="polite">
    <div class="handle" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </section>

  <div id="toast" class="toast" hidden role="status"></div>

  <script src="app.js"></script>
</body>
</html>
