# Keeps the free Supabase project from pausing. Supabase pauses free projects after about a week with
# little database activity, which would quietly stop shared reports while few riders use the app.
# Once a day this asks the database for the report list (the same public call the app makes).
# Note: GitHub turns off scheduled workflows in a repository with no commits for 60 days; it emails the
# owner first, and one click on "Enable workflow" (Actions tab) turns it back on.
name: Keep reports database awake

on:
  schedule:
    - cron: '17 11 * * *'   # every day, 6:17 AM in Bogotá
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Supabase for the report list
        env:
          URL: https://xyxalfmyethcsyrurmkf.supabase.co/rest/v1/rpc/list_reports
          KEY: sb_publishable_lqEWRpuUlZsWYmGzqmSUlQ_lmz2yuEV   # public key, the same one the app uses
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "$URL" \
              -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}')
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Reports listed: $(grep -o '"id"' /tmp/out.json | wc -l)"; exit 0; fi
            sleep 30
          done
          echo "::error::Supabase did not answer. The project may be paused: open supabase.com, project bogota-bici, Resume."
          exit 1
